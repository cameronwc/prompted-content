instructions:
- Line up guests into two facing rows to form an open aisle for the exit pathway, arming them
  with bubble wands.
- Position the couple at the start of the aisle, having them hold their inside hands linked
  and raised high above their heads in celebration.
- Instruct the couple to walk briskly forward down the center together, cheering and waving
  their outside free hands toward the crowd and camera.
- Direct the guests on both flanks to actively blow bubbles inward across the couple's walking
  path throughout the exit.
