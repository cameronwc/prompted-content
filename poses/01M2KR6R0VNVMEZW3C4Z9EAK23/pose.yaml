instructions:
- Position the woman standing on the sand, angled in a three-quarter view toward camera-right
  with knees softly bent and her upper body tilted slightly forward to bear weight.
- Carefully place the dog in a piggyback position on the woman's back, letting the dog's front
  paws rest comfortably over her shoulders.
- Direct the woman to reach her arms behind her back to securely grasp and support the dog's
  rear legs along her hips.
- Have the woman turn her head further toward camera-right with a big, natural laugh, allowing
  the dog to look in the same direction for a joyful, candid moment.
