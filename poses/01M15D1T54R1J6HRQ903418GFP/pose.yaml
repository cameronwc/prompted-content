instructions:
- Position the father standing centrally at the back of the frame, and have the mother kneel
  or crouch in the lower right foreground, angled toward camera-left.
- 'Cluster the three children tightly in the middle ground between the parents: place the
  oldest daughter standing on the middle-left, tuck the youngest child behind the mother on
  the right, and position the other daughter standing in the front-left directly beside her
  mother.'
- Direct the father and oldest daughter to look gently downward at the group, have the two
  younger children face toward each other with soft smiles, and have the mother tilt her head
  up to look affectionately at the daughter standing beside her.
