instructions:
- Position the groom standing with feet hip-width apart for stability, angled slightly toward
  the camera, and have him lift the bride into a horizontal bridal carry across his chest.
- Instruct the bride to wrap her left arm securely around the groom's neck and shoulder, extending
  her legs together toward the right side.
- Have the bride raise her right arm high overhead, holding her bouquet upward toward the
  sky while leaning her upper body slightly back with her head tilted up.
- Direct both subjects to look at each other with wide, candid laughter to capture a joyful,
  celebratory moment.
