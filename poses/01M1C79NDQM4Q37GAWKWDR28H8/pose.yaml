instructions:
- Have the couple lie down side by side on their backs on a blanket, with their feet pointed
  toward the ocean and heads closest to the camera.
- Ask them to interlock their inside hands resting gently between their chests or stomachs.
- Have each person use their outside hand to hold one side of the ultrasound photo up together
  against the ocean horizon.
- Position yourself low just above the tops of their heads, focusing sharply on the ultrasound
  image while keeping the couple softly framed in the foreground.
