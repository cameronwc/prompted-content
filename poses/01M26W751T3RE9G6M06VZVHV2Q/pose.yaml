instructions:
- Position the couple standing closely together in an open grassy field, with the groom on
  the right angled three-quarters toward the bride, and the bride on the left angled slightly
  toward the camera and groom.
- Have the groom place his forward hand flat and gently across the bride's upper waist/ribs,
  resting his other arm naturally at his side while keeping his weight evenly balanced.
- Instruct the bride to hold her bouquet down at her outer side in her right hand, letting
  the flowers tilt naturally toward the ground with a relaxed arm.
- Prompt the groom to look down warmly at the bride's face with a natural smile, and have
  the bride tilt her head slightly back while sharing an open, spontaneous laugh.
