instructions:
- Have the subject sit cross-legged on a patterned area rug, positioned slightly angled to
  the camera in front of a soft indoor natural light source.
- Position the dog directly in front of her lying flat on its back in a relaxed belly-up posture,
  with its legs curled in the air and head oriented toward the camera.
- Instruct the subject to lean forward over the dog, placing both hands gently on the dog's
  chest and belly as if scratching it playfully.
- Direct the subject to look down warmly at the dog with a natural, joyful smile while capturing
  the dog looking directly upside-down into the camera lens.
