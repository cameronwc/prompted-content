instructions:
- Position the bride on the left and the groom on the right, facing directly toward each other
  in a complete side profile.
- Have the groom wrap his arm around the bride's lower back or waist to pull her close, while
  the bride lifts her arm to rest her hand gently on the side of his neck or jawline.
- Instruct the couple to close their eyes and lean in for a gentle, romantic kiss on the lips.
- Drape the bride's long sheer veil up and over both of their heads to create an intimate
  canopy surrounding their upper bodies.
