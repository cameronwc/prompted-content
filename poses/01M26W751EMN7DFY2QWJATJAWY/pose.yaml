instructions:
- Position the couple along the shoreline in profile to the camera, with the bride standing
  slightly ahead on the left and the groom standing closely behind her right side.
- Have the bride hinge forward slightly at the hips, resting both hands flat against the front
  of her thighs, while turning her head back over her right shoulder to look and smile toward
  the groom.
- Direct the groom to lean forward slightly over her back, using both hands at her lower waistline
  as if adjusting or buttoning the back of her dress, keeping his eyes focused down on his
  hands.
