instructions:
- Have the woman sit on the sofa angled toward camera-left, with her legs bent in front and
  her upper body turned toward the left cushion.
- Position the dog sitting upright on the sofa cushion directly facing the woman, placing
  its front paws extended onto her upper chest and shoulders.
- Instruct the woman to place both hands gently around the sides of the dog's ribcage to support
  its posture.
- Have the woman lean slightly forward to bring her face almost nose-to-nose with the dog,
  smiling warmly while maintaining direct eye contact with the pet.
