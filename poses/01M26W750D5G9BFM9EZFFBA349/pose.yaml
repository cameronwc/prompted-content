instructions:
- Position the bride and groom standing closely side-by-side in the open field, angled slightly
  inward at three-quarter angles facing toward one another.
- Have each person hold a champagne coupe in their inner/front hand, raising the glasses to
  chest height so they gently touch together in a toast.
- Keep their outer arms hanging relaxed naturally at their sides, with weight balanced evenly
  on both feet.
- Direct them to look into each other's eyes and share a candid, joyful smile as they clink
  their glasses.
