instructions:
- Arrange the group in a tight horizontal line with the bride positioned slightly left of
  center, having everyone wrap their arms around each other's waists and shoulders to eliminate
  gaps.
- Have the bride raise one arm high overhead in a joyful celebration, keeping her other side
  pressed close to the bridesmaids.
- Angle the two people on the outer ends inward toward the middle to frame the line, resting
  their outer hands naturally on hips or holding a drink.
- Instruct everyone to lean in slightly toward the camera with big, candid, cheering expressions.
