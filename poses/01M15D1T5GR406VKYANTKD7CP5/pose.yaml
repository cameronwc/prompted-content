instructions:
- Have the three children sit side-by-side in a tight row directly on the grass, with the
  older child sitting cross-legged in the center and the two younger children flanking her,
  angled slightly inward with their hands relaxed in their laps.
- Position the parents sitting closely behind the children—father on the left and mother on
  the right—leaning in close together over the kids to create a compact, unified group.
- Drape a large knit blanket over the heads and shoulders of the parents, letting it form
  an arched canopy tent over all five family members with the outer sides cascading down to
  the grass.
- Direct the entire family to turn their faces inward toward one another, talking and laughing
  naturally to create candid, joyful interactions beneath the blanket tent.
