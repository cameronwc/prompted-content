instructions:
- Have the subject sit on the raised edge of a concrete curb, angling his torso at a three-quarter
  turn toward the camera.
- Instruct him to place both feet on the lower pavement, bending his knees so the forward
  leg is extended slightly further out and the other foot is tucked closer to the curb.
- Direct him to lean his upper body slightly forward from the hips and rest his forearms across
  his thighs, letting his hands clasp loosely between his knees.
- Have him turn his head directly toward the camera, relaxing his shoulders and smiling naturally.
