instructions:
- Position the couple standing side-by-side on an urban sidewalk, angled three-quarters toward
  each other and the camera.
- Instruct the bride to lean slightly forward at the waist, holding her bouquet pointed downward
  in her outer right hand and extending her left hand across her body.
- Have the groom step close and lean in toward the bride, clasping her extended left hand
  with his right hand at low waist level between them.
- Prompt the couple into genuine, candid laughter, allowing their heads to tilt slightly back
  and their shoulders to relax naturally in the moment.
