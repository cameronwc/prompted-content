instructions:
- Position a low wooden stool in the field and have the subject sit facing directly toward
  the camera with his knees apart and feet firmly planted.
- Instruct the subject to lean his upper body slightly forward, placing his right elbow on
  his right thigh and resting his chin atop his loosely closed right fist.
- Have him drop his left arm down naturally between his legs, resting his open, relaxed left
  hand flat between his thighs over the seat edge.
- Direct his head and eyes straight toward the camera lens with a relaxed, pleasant smile.
