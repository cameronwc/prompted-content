instructions:
- Position the couple sitting closely side-by-side on a light-colored sofa, with the bride
  on the left and the groom on the right, both angling their torsos slightly inward toward
  each other.
- Have the groom wrap his right arm around the bride's back so his right hand rests gently
  around her outer right waist or hip.
- Instruct the bride to rest both hands down on her lap near the groom's right thigh, while
  the groom places his left hand over her hands to hold them gently.
- Ask both subjects to turn their heads toward one another and prompt genuine interaction,
  capturing the bride laughing up at the groom and the groom looking down at her with an affectionate
  smile.
