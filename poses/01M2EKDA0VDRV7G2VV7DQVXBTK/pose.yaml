instructions:
- Place a full-length framed mirror upright on the sand, angled slightly so the ocean horizon
  is visible in the reflection.
- Position the subject facing the mirror with their back turned three-quarters away from the
  camera.
- Have the subject bend their knees into a playful crouch with feet set wide, leaning forward
  toward the glass.
- Instruct the subject to raise their left hand to run their fingers through their hair while
  letting their right arm hang loosely at their side.
- Direct the subject to look at their own reflection and laugh genuinely, while framing the
  shot over their shoulder to capture the joyful reflection in full.
