instructions:
- Position the parent standing in profile next to the decorated fireplace mantel.
- Have the parent securely lift the baby straight up into the air at arm's length, supporting
  under the baby's torso.
- Instruct the parent to tilt their head back and gaze up warmly at the baby with an open
  smile.
- Frame at the parent's chest level to capture the full vertical connection between parent
  and child against the warm background glow.
