instructions:
- Have the pregnant subject stand facing forward with soft window light entering from camera
  right, and position the partner standing directly behind her in a close embrace, chest to
  back.
- Guide the partner to wrap his arms around her from behind, placing one hand along the side
  of her waist and the other cradling underneath the lower bump.
- Instruct the pregnant subject to place her top hand across the upper curve of her belly
  and rest her lower hand gently over the partner's hand at the base of the bump.
- Direct both subjects to tilt their heads slightly downward, keeping their focus and soft
  smiles directed toward the baby bump.
