instructions:
- Position the subject seated on a tall wooden stool, angling her torso slightly to her left
  while keeping her posture upright.
- Have her elevate her right leg by resting her right foot on a rung of the stool so her knee
  is raised, while extending her left leg downward with her foot toward the floor.
- Instruct her to rest her forearms along her thighs, letting both hands meet loosely over
  her lap.
- Have her turn her head directly toward the camera with a slight natural tilt and a relaxed,
