instructions:
- Have the pregnant mother stand in a three-quarter profile facing toward camera-left in front
  of soft indoor window light.
- Position the partner standing closely directly behind her, pressing his chest against her
  back.
- Have the mother cradle her belly by placing her top hand resting above the bump and her
  lower hand cupping the bottom.
- Instruct the partner to wrap his arms around her waist from behind to rest his hands on
  and around her bump alongside hers.
- Direct both subjects to lean their heads together—with the partner resting his head near
  her shoulder/temple—and look down warmly at the belly with relaxed smiles.
