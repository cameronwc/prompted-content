instructions:
- Position a backless wooden stool in front of a neutral backdrop, seating the subject angled
  slightly toward camera-left.
- Have the subject spread her legs asymmetrically, bending her right leg outward with the
  foot resting back on the stool rung and extending her left leg forward and down toward the
  floor.
- Instruct her to rest both palms flat on her thighs just above the knees, keeping her elbows
  slightly soft and shoulders down and relaxed.
- Direct her to sit tall through the spine, turning her head slightly toward camera-left to
  gaze softly off-camera toward the window light.
