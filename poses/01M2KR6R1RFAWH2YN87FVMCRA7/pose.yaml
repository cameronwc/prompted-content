instructions:
- Have the man sit cross-legged on the floor inside the doorway on the right side of the frame,
  resting his back and shoulder lightly against the doorframe while facing in profile to the
  left.
- Position the dog sitting upright on the floor directly opposite the man on the left, facing
  profile to the right toward the man.
- Direct the man to reach forward with his right hand and gently scratch or hold the dog at
  its neck just beneath the collar, keeping his left arm relaxed across his lap.
- Have the man lean slightly forward with a warm smile and look directly into the dog's eyes
  to establish quiet, mutual eye contact between the two.
