instructions:
- Position the couple standing side-by-side in front of a large bright window, with the groom
  on the right turned in near-profile facing the bride, and the bride on the left angled slightly
  forward toward the camera.
- Direct the groom to stand tall with his feet angled slightly toward the bride, arms resting
  naturally at his sides, looking warmly down at her face.
- Have the bride bring her right hand up to gently touch her right cheek in a sweet, candid
  gesture, while holding her bouquet down naturally by her left side.
- Instruct the bride to smile or laugh joyfully toward the camera while the groom keeps his
  gaze affectionately fixed on her.
