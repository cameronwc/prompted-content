instructions:
- Position a large, full-length mirror vertically against a neutral wall and have the pregnant
  subject stand a couple of feet in front of it, angled slightly toward the glass.
- Instruct the subject to cradle her baby bump with both hands, resting one hand across the
  upper curve and supporting beneath the belly with the other.
- Ask her to tilt her head slightly downward, gently smiling as she gazes at her bump in the
  mirror's reflection.
- Position the camera behind and to the right of the subject to capture her side profile softly
  out of focus in the foreground while keeping the sharp focus on her reflection in the mirror.
