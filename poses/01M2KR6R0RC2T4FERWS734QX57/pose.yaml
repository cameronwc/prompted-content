instructions:
- Have the adult subject kneel directly on both knees in the sand, angled slightly toward
  the camera with their upper body leaning forward.
- Place the dog facing the subject in a playful, braced tug-of-war stance with its front paws
  planted firmly in the sand.
- Have the subject grip one end of a thick rope toy with both hands close to their midsection
  while the dog grips the other end in its mouth to create taut tension on the line.
- Prompt the subject to laugh and focus entirely on playing with the dog to capture an energetic,
  candid interaction.
