instructions:
- Have the subject sit casually on the edge of a raised stone step or sidewalk curb, angling
  their torso slightly toward camera-left.
- Direct them to extend both legs down the steps toward the pavement, keeping the knees slightly
  bent and feet relaxed in sneakers.
- Instruct the subject to lean their upper body back slightly onto their left arm, planting
  the left hand flat on the ground behind their hip for support.
- Have them rest their right forearm and relaxed hand across their right upper thigh or knee.
- Ask them to turn their head slightly to their left (camera-right) with a gentle, relaxed
  smile, gazing off-camera.
