instructions:
- Seat all three subjects side by side on the center of the wooden bench, placing the child
  between the two parents with minimal space between them.
- Have the father on the left angle his body slightly inward toward the child with his hands
  resting naturally on his thighs, while the mother on the right angles inward with her legs
  swept to her right and her right hand placed gently on the child's side.
- Position the child seated upright with her hands resting loosely in her lap, turning her
  head to look up and laugh toward her father.
- Instruct both parents to look down fondly at their daughter, with the father maintaining
  direct eye contact with her and the mother watching them with a warm, relaxed smile.
