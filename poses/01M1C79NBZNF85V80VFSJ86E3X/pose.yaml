instructions:
- Have both parents sit on the floor facing each other with their legs tucked close together
  to create a secure cradle between them.
- Lay the baby on their back in the center on top of a soft red blanket spread across the
  parents' laps.
- Ask both parents to lean inward close to the baby, placing their hands gently along the
  baby's sides and legs.
- Position yourself directly above for a high-angle shot, keeping parents focused down on
  the baby's face while capturing the baby looking upward.
