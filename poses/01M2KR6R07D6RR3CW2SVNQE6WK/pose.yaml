instructions:
- Position the subject standing in a three-quarter profile facing frame-right, angled slightly
  toward soft natural window light.
- Instruct her to hold the dog upright against her chest, using her left arm to support its
  lower body and hindquarters from beneath.
- Have her bring her right hand up across her chest to gently hold or scratch the front of
  the dog's neck and collar area.
- Angle the dog facing back toward her chest and face, allowing its front paw to rest naturally
  against her upper arm or torso.
- Direct the subject to look up into the dog's face with a genuine, warm smile, encouraging
  the dog to look directly back down at her eyes.
