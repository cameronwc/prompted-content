instructions:
- Position the couple standing closely face-to-face in a grassy field, angled slightly three-quarters
  toward the camera with the pregnant woman on the left and her partner on the right.
- Have the woman reach her left arm up and wrap it around the back of his neck, resting her
  hand gently on his upper back or shoulder.
- Instruct the partner to wrap his arms around her waist, resting his front hand gently across
  her upper baby bump and his back arm around her lower back to draw her in close.
- Ask both subjects to lean their heads together until their foreheads gently touch, tilting
  their faces slightly downward with soft, joyful smiles.
