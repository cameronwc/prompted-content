instructions:
- Have the groom stand on the right in a wide, stable stance, facing left toward the bride.
- Instruct the groom to support the bride securely by wrapping his hands around her lower
  back and waist, guiding her to arch backward into a controlled dip to the left.
- Have the bride let her front arm hang relaxed straight downward toward the ground, loosely
  gripping the stems of her bouquet upside down.
- Direct the groom to lean his upper body forward over the bride, bringing their faces very
  close together so they can smile and laugh directly into each other's eyes.
