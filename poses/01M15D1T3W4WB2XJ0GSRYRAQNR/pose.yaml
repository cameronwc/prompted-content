instructions:
- Place a small woven blanket on the sand and seat the toddler in the center with their legs
  stretched forward toward the camera.
- Have the father sit closely on the left side, resting on his hip with legs tucked softly
  to the side, placing his right arm around the toddler to hold them securely.
- Position the older daughter sitting tight to the right side of the toddler, angling her
  body inward so her shoulder and arm press close against the toddler and father.
- Direct both the father and daughter to lean their heads in closely together, looking down
  affectionately with warm smiles at the toddler, while encouraging the toddler to look up
  and engage with them.
