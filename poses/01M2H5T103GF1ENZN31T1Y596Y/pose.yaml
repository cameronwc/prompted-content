instructions:
- Have the subject sit on a backless wooden stool facing straight toward the camera with knees
  bent and placed slightly wider than hip-width apart.
- Instruct the subject to lean his upper body forward slightly from the waist toward the camera
  to create an engaged, welcoming presence.
- Have him rest his forearms across his thighs just above the knees, letting his hands meet
  loosely in the center between his legs with fingers naturally relaxed and draped downward.
- Ask the subject to square his shoulders to the lens, keep his neck relaxed, and look directly
  into the camera with a warm, gentle smile.
