instructions:
- Place the bride and groom centered and close together, with the groom wrapping his arm around
  the bride's waist while throwing his head back in a hearty laugh, and the bride holding
  her bouquet low in her outer hand while laughing toward him.
- Form a tight cluster on the bride's side with two bridesmaids leaning inwards toward her,
  placing hands on each other's backs and the bride's waist, while a groomsman stands slightly
  behind them leaning into the frame.
- Position the third bridesmaid and second groomsman on the groom's side, having the bridesmaid
  turn inwards to rest her hands lightly on the groom's chest and lapel while the groomsman
  stands closely behind her with a hand on her shoulder.
- Instruct the entire wedding party to huddle close together, direct all their attention and
  smiles inward toward the bride and groom, and prompt genuine group laughter.
