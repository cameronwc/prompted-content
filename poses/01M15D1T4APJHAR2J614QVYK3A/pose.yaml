instructions:
- Seat the teen on the left and the mother on the right closely together on the center of
  the couch, positioning the toddler nestled snugly between them.
- Have both the teen and the mother angle their bodies inward, leaning their shoulders and
  torsos close together to enclose the toddler in an intimate triangular shape.
- Instruct the mother and teen to bring their hands together across the toddler's waist and
  lap, lightly overlapping their fingers in a shared gentle embrace.
- Direct the mother and teen to turn their faces toward the toddler with warm, natural smiles,
  leaning their heads close to his beanie while prompting the toddler to laugh and look slightly
  upward.
