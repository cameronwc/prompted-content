instructions:
- Position the father standing at the back center, with the older son standing directly in
  front of him, the mother standing tightly to the right angled inward toward her son, and
  the toddler standing at the front center.
- Instruct the father to rest his hands on the older son's outer shoulders, while the older
  son brings his hands forward onto the toddler's shoulders to anchor him from behind.
- Have the mother press closely against her older son's left side with her arm wrapping around
  behind him, creating a tight, connected family cluster.
- Direct the mother and older son to look directly at each other and laugh, while the father
  looks down affectionately at them and the toddler tilts their head upward toward the older
  brother.
