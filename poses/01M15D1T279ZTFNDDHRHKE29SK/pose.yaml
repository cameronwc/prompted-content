instructions:
- Have the subject sit angled on a wooden staircase with their back toward the wall/riser,
  angling their torso roughly 45 degrees toward the camera.
- Position their far leg (camera-right) bent with the foot planted flat on a lower step, while
  extending the near leg (camera-left) further down the stairs with the foot resting flat
  across a bottom tread.
- Instruct the subject to lean forward slightly from the hips, resting their forearms loosely
  near their thighs and clasping their hands together in their lap in front of the raised
  knee.
- Have the subject turn their head squarely toward the camera with a relaxed, warm smile while
  keeping their shoulders natural and down.
