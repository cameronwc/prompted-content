instructions:
- Position the groom on the right and the bride on the left, facing each other in a dance
  frame with the groom providing a wide, stable stance.
- Have the groom wrap his right arm firmly around the bride's lower back to support her weight
  as she arches back into a gentle dip toward the left.
- Instruct the bride to extend her right leg out to the side with her foot lightly lifted
  off the floor, while resting her left hand around the groom's torso/back.
- Have the groom hold the bride's right hand at chest height with his left hand, centered
  near his lapel.
- Direct both subjects to look directly into each other's eyes and share a joyful, natural
  smile.
