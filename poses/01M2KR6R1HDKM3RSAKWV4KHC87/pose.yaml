instructions:
- Position the woman kneeling upright on both knees on the floor on the right side of the
  frame, turned into a side profile facing toward the left.
- Place the dog sitting on the floor directly in front of her in side profile, facing toward
  the right.
- Have the woman rest her right hand loosely near her lap while extending her left hand forward,
  palm up, to support the dog's lifted front paw.
- Instruct the woman to look down warmly with a gentle smile at the dog, keeping the posture
  relaxed and engaging.
- Set the camera at low eye level with the dog and woman to capture their full bodies in side
  profile against the neutral background.
