instructions:
- 'Line up the five subjects in a single-file diagonal chain facing toward camera-left in
  an open field, ordered from left to right: lead groomsman/groom, second groomsman, bride
  holding her bouquet, and two bridesmaids trailing at the rear.'
- 'Have each person connect playfully to the person ahead: the second groomsman places his
  hands on the lead man''s arm/shoulder, the bride leans her head and upper body affectionately
  against the second groomsman''s back while holding her bouquet in front, and each bridesmaid
  rests her hands on the waist or sides of the person in front of her.'
- Instruct the entire group to bend their knees, lean forward in unison, and take staggered
  walking steps toward camera-left to create the dynamic effect of pushing or following a
  playful train.
- Direct everyone to tilt their heads naturally toward the motion, laugh out loud, and let
  the movement feel candid and unposed.
