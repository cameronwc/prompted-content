instructions:
- Seat the mother and baby close together on a cozy rug in front of a warm fireplace and holiday
  decor.
- Position the mother sitting casually with legs folded or crossed, angled inward toward her
  baby.
- Place the baby sitting upright directly next to mom, giving them a small wrapped gift to
  hold in their lap to anchor their hands.
- Direct mom to keep her eyes and soft attention entirely on the baby, letting natural candid
  reactions unfold.
