instructions:
- Position the bride and groom standing closely facing each other in full profile along the
  pathway.
- Have the groom wrap his hand around the bride's waist, while the bride holds her bouquet
  facing downward naturally at her side.
- Drape the bride's long, sheer veil up and over both of their heads, allowing it to billow
  softly like a canopy around their upper bodies.
- Direct the couple to lean in and share a gentle, romantic kiss on the lips beneath the veil.
