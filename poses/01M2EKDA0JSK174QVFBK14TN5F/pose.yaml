instructions:
- Have the subject drop into a deep crouch in a three-quarter profile facing to the right,
  keeping her right foot planted flat on the ground and resting the back left foot on its
  ball.
- Instruct her to lean her upper body forward toward the camera, draping her right arm over
  her right knee so the hand hangs loosely downward, while reaching her left hand back toward
  the ground behind her right foot for balance.
- Direct her to turn her face directly toward the camera with a slight head tilt, offering
  a wide, genuine open-mouthed laugh or smile.
