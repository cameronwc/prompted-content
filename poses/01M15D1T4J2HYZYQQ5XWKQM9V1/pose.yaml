instructions:
- Drape a textured blanket over the back and arm of a sofa to create a low canopy or fort
  structure with an opening toward the right side.
- Position the mother and toddler sitting close together inside the blanket fort on the couch
  cushions, leaning slightly forward toward the opening.
- Have the older child stand on the floor to the right of the couch, bending forward at the
  waist while gripping the edge of the blanket with both hands to pull it open.
- Direct the mother and toddler to look out toward the standing child, encouraging natural,
  candid interaction and smiles between all three subjects as they peek into the fort.
