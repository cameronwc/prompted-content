instructions:
- Place a large, vertical full-length floor mirror on the left side of the frame leaning against
  the wall.
- Position the subject standing barefoot just to the right of the mirror, oriented in full
  profile facing towards the mirror so both her body and reflection are visible.
- Have the subject cradle her baby bump with both hands, resting one hand gently above the
  top curve of the belly and the other hand supporting underneath.
- Instruct her to softly tilt her head down to look at her bump with a gentle, quiet smile
  while keeping her shoulders relaxed.
