instructions:
- Position the couple standing close together near the water's edge, angled inward at roughly
  three-quarter profiles toward each other, with the bride on the left and the groom on the
  right.
- Have the bride hold the floral bouquet centered at waist height with both hands, while the
  groom places his forward hand gently over hers on the stems and rests his other arm naturally
  at his side.
- Direct both subjects to tilt their heads slightly down and inward toward the bouquet with
  warm, relaxed smiles.
