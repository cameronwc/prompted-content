- Instruct the bride to place her front arm across the groom's upper chest and wrap her back
  arm around his neck/shoulder, loosely holding her floral bouquet so it rests over his shoulder
  and extends toward the background.
- Direct the groom to gaze warmly down at the bride, while having the bride cast her eyes
  downward with a natural, joyful smile as if sharing a candid moment.
