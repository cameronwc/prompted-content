instructions:
- Position the bride and groom standing side-by-side in an open field, facing inward toward
  each other with the bride angled slightly toward the camera.
- Drape the groom's blue suit jacket over the bride's shoulders and have her hold her bouquet
  down in her right hand at hip level.
- Instruct the couple to clasp hands together centrally at the bride's chest height, with
  the groom extending both arms forward to hold her hands.
- Have the groom drop into a playful, dynamic posture with bent knees as if dancing or bouncing
  back on his heels, leaning toward the bride.
- Direct both subjects to look at each other and engage in a natural, candid laugh to capture
  dynamic movement and joyful expressions.
