instructions:
- Position the adult male standing on the right and the older child on the left, facing inward
  toward each other with window light illuminating them from the right side of the room.
- Place the toddler between them, having the adult grip one hand/wrist and the older child
  grip the other, gently swinging the toddler up into the air with their feet kicking forward.
- Position the younger daughter standing slightly behind in the opening between the toddler
  and the adult, facing forward-left toward the swinging toddler.
- Direct the father, older child, and younger daughter to look joyfully at the swinging toddler,
  encouraging big, genuine smiles and laughter to capture a candid, playful moment.
