instructions:
- Have the subject stand beside a brick wall with a window sill, leaning their left side against
  the wall and crossing their right leg in front of their left leg at the shin.
- Instruct the subject to rest their left elbow on the window sill ledge, raising the forearm
  so the curled hand lightly props up their chin.
- Direct the subject to rest their right hand on their right hip with fingers forward and
  the elbow flared outward to create defined negative space.
- Ask the subject to turn their face directly toward the camera, tilting the chin up slightly
  and offering a relaxed, natural smile.
