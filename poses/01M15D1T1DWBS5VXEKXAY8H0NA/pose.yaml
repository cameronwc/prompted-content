instructions:
- Position the couple standing very close together, angled slightly inward toward each other
  with their bodies turned in a three-quarter view relative to the camera.
- Drape a large patterned blanket around both of their backs and over their outer shoulders
  so it cocoons them together.
- Have the partner on the right wrap their front arm around the other person's waist, resting
  their hand flat against the side of their torso.
- Direct the partner on the left to rest their front hand gently on the inner edge of the
  blanket near their chest.
- Have both subjects look directly into each other's eyes with warm, natural smiles.
