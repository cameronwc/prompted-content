instructions:
- Position the father on the left and the mother on the right, standing barefoot on the beach
  with the ocean behind them and angled slightly inward toward each other.
- Place the two older siblings standing in the background between the center and the mother,
  angled toward the center.
- Have the father and mother each grip one hand of the toddler positioned between them and
  lift the toddler fully off the sand so the child's legs swing forward mid-air.
- Direct both parents and the older siblings to look affectionately at the laughing toddler
  while the toddler faces forward toward the camera.
