instructions:
- Position the dog in an open grassy field during golden hour, orienting the setup so the
  low sun is behind and slightly to the side of the dog for warm rim lighting.
- Crouch or lie down to set the camera at a low perspective, level with the dog's eye height,
  framing the open field symmetrically.
- Have an assistant release or call the dog so it runs in a direct, straight line toward the
  lens.
- Use continuous autofocus and a fast shutter speed to capture the dog mid-gallop with its
  ears flapped outward, front paws driving forward, and eyes locked directly onto the camera.
