instructions:
- 'Line the family up side-by-side in an open field facing the camera, arranged from left
  to right: father, older daughter, toddler son, and mother.'
- 'Have them connect across the line by holding hands: father holding daughter''s right hand,
  daughter holding toddler''s right hand, and mother holding toddler''s left hand, letting
  the outside hands hang naturally at their sides.'
- Instruct the family to stroll forward slowly toward the camera in mid-stride, keeping an
  even pace across the line.
- Direct the father to turn his head to look affectionately toward his daughter, the mother
  to look down and smile at the toddler, the daughter to smile gently toward her brother,
  and the toddler to look naturally forward.
