instructions:
- Position the parents side-by-side in an open field, walking together toward the camera at
  a natural, steady pace with the mother on the left and the father on the right.
- 'Have each parent give a piggyback ride to a child: place the younger boy on the mother''s
  back with his arms wrapped around her shoulders, and the older daughter on the father''s
  back with her arms around his neck and chest.'
- Direct the children to lean in close against their parents' backs, letting their legs dangle
  naturally along the parents' sides and hips as they hold on securely.
- Instruct all four subjects to laugh, interact, and look generally forward or slightly toward
  each other, capturing a joyful, dynamic walking motion.
