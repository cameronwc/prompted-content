instructions:
- Have the subject sit cross-legged or with knees folded up on a comfortable sofa positioned
  next to a large window to capture soft side lighting.
- Place the dog lying horizontally across the subject's lap facing toward the light source,
  with its front paws resting extended forward across her thighs.
- Instruct the subject to lean her upper body forward over the dog, wrapping both arms gently
  around its neck and upper chest with her hands loosely clasped.
- Have the subject rest her head close against the dog's neck and tilt her face downward with
  a warm, natural smile directed at her pet.
