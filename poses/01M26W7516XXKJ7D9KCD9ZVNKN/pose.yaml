instructions:
- Position the couple standing a couple of feet apart facing each other in side profile against
  a minimalist background, leaving enough room for full-length framing.
- Have the bride hold her bouquet down low in her right hand and execute a fluid spin or twirl
  so the full skirt of her wedding dress fans out wide at the base.
- Instruct the groom to stand with feet slightly apart facing the bride, holding his hands
  lightly out at waist level with open palms in an admiring, receptive posture.
- Direct both subjects to keep their eyes locked on each other and capture the shot mid-spin
  during their shared, natural laughter.
