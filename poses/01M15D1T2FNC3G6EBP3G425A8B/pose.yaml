instructions:
- Position the subject sitting directly on the floor, angled slightly toward the camera with
  their right leg folded flat against the floor and their left knee raised upright.
- Instruct the subject to lean their torso forward from the hips toward the camera for an
  approachable, relaxed posture.
- Have the subject drape their left forearm naturally over the raised left knee with the fingers
  relaxed, while extending the right arm down across the center of their lap, resting the
  right hand gently near the floor.
- Direct the subject to square their face directly toward the lens with a warm, natural smile.
