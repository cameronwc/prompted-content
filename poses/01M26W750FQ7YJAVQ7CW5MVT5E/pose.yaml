instructions:
- Position the bride and groom facing one another in a side-profile view, standing close together
  in an open indoor space with natural window light on the right.
- Instruct the bride on the left to hold her floral bouquet at waist height with her outer
  arm while reaching her inner arm up to gently adjust the groom's necktie.
- Direct the groom on the right to rest his front hand gently near his jacket button or waistline
  while keeping his other arm relaxed at his side.
- Have the bride look warmly up toward the groom's face with a soft smile, and ask the groom
  to tilt his head slightly down toward her hands with an affectionate, happy expression.
