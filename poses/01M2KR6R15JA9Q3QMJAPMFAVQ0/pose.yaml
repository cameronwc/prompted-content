instructions:
- Have the adult subject stand squarely facing the camera in the field with a relaxed, upright
  posture and weight distributed evenly on both feet.
- Instruct the subject to hold the dog across their chest at mid-torso height, supporting
  the dog's lower body and hindquarters with their right forearm and wrapping their left hand
  across the dog's upper chest.
- Position the dog diagonally across the subject's torso so its head rests on the subject's
  left side (camera right) with its back legs dangling naturally on the right side.
- Ensure both the subject and the dog are facing directly toward the camera, with the subject
  offering a natural, relaxed smile.
