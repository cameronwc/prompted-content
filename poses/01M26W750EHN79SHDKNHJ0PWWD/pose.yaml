instructions:
- Position the bride standing upright a few steps up on the staircase angled slightly outward,
  arranging the lace train of her dress so it gracefully cascades down the steps to the left.
- Place the groom facing her on the lower steps, stepping his lead foot up onto a higher stair
  with a bent knee to simulate walking up toward her.
- Instruct the bride to hold her floral bouquet centered in front of her waist with one hand
  and extend her other hand downward to clasp the groom's raised hand midway between them,
  keeping his opposite arm relaxed at his side.
- Direct both subjects to lock eyes and share a candid laugh, with the groom looking up affectionately
  and the bride looking down with a joyful, smiling expression.
