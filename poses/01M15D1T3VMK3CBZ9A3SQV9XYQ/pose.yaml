instructions:
- Position the mother on the right foreground and the older daughter on the left foreground
  walking slowly forward side-by-side across the grassy field, angled slightly toward each
  other.
- Have the mother give a piggyback ride to a young daughter, supporting her while the daughter
  wraps her arms over her mother's shoulders, with both turning their faces to look directly
  at each other while laughing.
- Have the older daughter carry one toddler piggyback style, letting the toddler hold onto
  her shoulders from behind while she turns her head to smile toward her mother and sister.
- Place the father directly behind the older daughter, carrying the second toddler high on
  his back, and direct him to look across warmly at the mother and children to unify the group's
  shared laughter.
