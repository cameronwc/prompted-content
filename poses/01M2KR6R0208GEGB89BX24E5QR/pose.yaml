instructions:
- Have the woman sit comfortably on the middle tread of an indoor wooden staircase, leaning
  slightly forward with her knees together and feet resting on the step below.
- Position the dog seated on the step immediately to her right, bringing its body close to
  hers and resting its front paws securely across her lap.
- Instruct the woman to wrap her right arm around the front of the dog's chest and place her
  left hand gently under the dog's chin to stroke its neck.
- Direct the woman to look down lovingly at the dog with a warm smile, encouraging the dog
  to tilt its head up toward her face.
