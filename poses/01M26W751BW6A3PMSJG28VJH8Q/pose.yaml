instructions:
- Position the bride and groom standing closely together and turned inward to face each other
  in three-quarter profile.
- Have the groom place his right hand gently around the bride's waist, while raising a champagne
  flute in his left hand at chest level.
- Direct the bride to hold a champagne flute up in her right hand to toast with him, keeping
  her left arm relaxed down holding her floral bouquet at hip level.
- Instruct both subjects to maintain eye contact with each other, smiling warmly as they clink
  their glasses together.
