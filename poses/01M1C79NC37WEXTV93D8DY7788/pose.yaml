instructions:
- Seat the baby sitting upright on a rug or comfortable floor space, angled diagonally toward
  a warm fireplace or tree lights in the background.
- Place a small, lightweight wrapped gift box directly in their lap for their hands to grasp
  and explore.
- Position a parent or assistant just behind and slightly above the photographer to draw the
  baby's gaze up and away with gentle sounds or games.
