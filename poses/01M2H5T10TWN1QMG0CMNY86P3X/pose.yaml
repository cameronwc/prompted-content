instructions:
- Position the subject seated or perched with her body turned roughly three-quarters to the
  right.
- Have her rest her right hand flat and relaxed on top of her right thigh or raised knee.
- Instruct her to turn her head back toward the camera to face the lens at a slight three-quarters
  angle while keeping her shoulders angled away.
- Direct her to hold a soft, confident smile and position her so the window light creates
  a warm rim light along the back of her hair and shoulders.
