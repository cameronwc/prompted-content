instructions:
- Position the couple standing close together, angled in three-quarter view toward each other
  in front of a bright indoor window.
- Have both subjects jointly hold the bridal bouquet centered between them at waist height
  with both hands grasping the stems together.
- Instruct the bride to remain grounded with weight evenly distributed, head turned toward
  the groom with an authentic, open-mouthed laugh.
- Direct the groom to jump straight up in place a few inches off the ground while maintaining
  his grip on the bouquet, throwing his head back in mid-air with an ecstatic laugh.
