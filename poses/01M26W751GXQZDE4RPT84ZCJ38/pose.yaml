instructions:
- Line up the wedding party in a single horizontal row across the street to walk forward together,
  positioning the Bride and Groom in the center, flanked on each side by a Bridesmaid and
  an outer Groomsman.
- Have the Bride and Groom hold hands in the center; the Bride holds her floral bouquet at
  waist height with her outer hand, while both turn their heads toward each other with natural,
  laughing expressions.
- Instruct each Bridesmaid to hold her bouquet centered in front of her midsection with both
  hands, stepping forward naturally.
- Position the outer Groomsmen with relaxed postures—the far-left groomsman with arms loosely
  at his sides and the far-right groomsman loosely clasping his hands in front of his torso.
- Have the entire group walk slowly forward in unison, with the flanking groomsman-bridesmaid
  pairs turning their heads inward to chat and smile at each other rather than looking at
  the camera.
