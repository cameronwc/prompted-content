instructions:
- Place a textured knit blanket on the floor near the hearth, keeping safe clearance from
  the fireplace.
- Position the baby on their stomach propped up on their forearms, angled slightly toward
  the camera.
- Place a small tabletop Christmas tree or warm light source behind the baby to create soft
  background bokeh.
- Lower your shooting angle completely to floor level, framing at eye height with the baby.
