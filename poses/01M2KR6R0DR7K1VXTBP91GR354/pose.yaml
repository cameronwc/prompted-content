instructions:
- Position the dog in a sternal recumbency (sphinx pose) on a patterned floor rug, angling
  its body diagonally with the hindquarters resting back and to the right.
- Extend both front legs forward along the ground so the chest stays upright and supported.
- Get down to the dog's eye level with a low camera angle, positioning the dog in front of
