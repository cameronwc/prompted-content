instructions:
- Position the couple standing side-by-side facing directly towards the camera against a neutral
  studio backdrop, with feet hip-width apart and standing close together.
- Instruct the couple to clasp their inner hands—her left hand and his right hand—and raise
  them high overhead in a shared celebratory gesture.
- Have the bride hold her floral bouquet straight up in her outer right hand, and have the
  groom raise his outer left hand high with an open palm reaching upward.
- Direct both subjects to tilt their heads slightly back, looking upward with joyful, wide
  laughing expressions while bubbles float through the frame.
