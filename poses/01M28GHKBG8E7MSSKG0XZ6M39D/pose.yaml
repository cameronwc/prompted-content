instructions:
- Gather the couple and a small group of guests or bridal party members into a loose, tight
  semi-circle on the dance floor.
- Position the bride and groom near the center-right, angled inward toward the rest of the
  group.
- Have surrounding guests face one another at dynamic, varying angles with weight shifted
  playfully and hands mid-motion as if actively dancing.
- Instruct everyone to focus their attention across the circle on each other rather than the
  camera to maintain candid energy.
