instructions:
- Have the couple face each other in a close partner dance hold, with the man facing slightly
  toward camera and the woman angled three-quarters away.
- Place the man's right hand securely on the woman's lower back and raise their joined outer
  hands out to the side at chest level.
- Position the woman's left arm wrapped around his side or shoulder, keeping her profile visible
  to the lens.
- Have them gently sway or take a small step together, with the man looking down warmly at
  her face.
