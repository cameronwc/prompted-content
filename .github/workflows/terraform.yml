name: terraform

# Plan only. Apply is never automated: it is run by a human, locally, via
# `make tf-apply-<env> CONFIRM=1`.

on:
  pull_request:
    paths:
      - "infra/**"

env:
  # Scoped Cloudflare API token (R2 edit on this account only) and account id
  # from repository secrets; the AWS_* pair is an R2 S3 token scoped to the
  # state bucket. All may be absent before the account is connected — the
  # plan steps then skip with a notice instead of failing the check.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL_S3: ${{ secrets.R2_STATE_ENDPOINT }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: fmt
        run: terraform fmt -check -recursive infra

      - name: bootstrap init + validate
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate

      - name: envs init + validate
        run: |
          for env in dev prod; do
            terraform -chdir=infra/envs/$env init -backend=false -input=false
            terraform -chdir=infra/envs/$env validate
          done

      - name: envs plan
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::notice::Cloudflare/R2 secrets not configured; skipping plan."
            exit 0
          fi
          for env in dev prod; do
            terraform -chdir=infra/envs/$env init -input=false -reconfigure
            terraform -chdir=infra/envs/$env plan -input=false -lock-timeout=60s
          done
