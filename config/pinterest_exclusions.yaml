# Rights exclusions for the Pinterest pin pipeline. ABSOLUTE: anything matched
# here never reaches a pin, contact sheet, or CSV row, in any cohort.
#
# Three layers, all checked by tools/pinterest/rights.py before any rendering:
#   filename_patterns  glob patterns matched against the pose's provenance
#                      source filename (from inbox/<shoot>/_drafts, when the
#                      local checkout has it) AND its on-disk image filenames.
#   excluded_shoots    shoot identifiers (inbox/<shoot> / archive/<shoot>).
#                      Resolved to pose ids through the draft records' pose_dir.
#   excluded_pose_ids  explicit pose ids. Pose records do not store their
#                      shoot, and inbox/ is gitignored, so every pose resolved
#                      from an excluded shoot is ALSO listed here explicitly —
#                      this file is the durable record. `pins scan-rights`
#                      re-derives the list and reports any drift.
#
# apply_to_text_pins: the verbal prompts on these records were written from
# the photographs, so by default they are kept out of text pins as well.

filename_patterns:
  - "ACTNATURALLY_PHOTOS-*"

excluded_shoots:
  - 123farm-lavender-couples   # Act Naturally Photos, 123 Farm lavender, Beaumont CA

