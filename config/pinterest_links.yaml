# category (+ optional tag) -> destination URL. Category is the primary
# key: a tag (light, location, subject type, large_group) can only pick
# between rules for the SAME category, never send a pose to another guide.
# Unmapped categories fall back to `fallback` silently; the run prints which
# categories fell back. Pins must never publish to a 404: only add a rule
# once the guide page is live on cooperindustries.cc.
fallback: https://cooperindustries.cc/prompted/marketing/
base: https://cooperindustries.cc/prompted/guides
rules:
  # Live guides (2026-09-04)
  - { category: family,     tag: large_group, slug: family-of-five-poses }
  - { category: family,                       slug: what-to-say-natural-smiles-family }
  - { category: couples,                      slug: what-to-say-couples-stiff }
  - { category: engagement,                   slug: what-to-say-couples-stiff }
  # No guide yet: maternity and senior fall back to the marketing page.
  # Restore when these ship:
  # - { category: family,     tag: golden, slug: golden-hour-prompts }
  # - { category: couples,    tag: golden, slug: golden-hour-prompts }
  # - { category: engagement,              slug: engagement-session-scripts }
  # - { category: maternity,               slug: maternity-prompts-that-respect-the-client }
  # - { category: family,     tag: child,  slug: directing-kids-without-bribing }
